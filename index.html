<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerico & Friah | Wedding Invitation</title>

    <!-- Open Graph Social Preview Tags -->
    <meta property="og:title" content="Jerico & Friah's Wedding Invitation">
    <meta property="og:description" content="You're invited! Click to view our wedding details, story, and entourage.">
    <meta property="og:image" content="https://raw.githubusercontent.com/JericoCentino/JERICOMmendedforFRIAHforever/main/images/header-img/HeroBanner.png">
    <meta property="og:url" content="https://jericocentino.github.io/JERICOmmendedforFRIAHforever/">
    <meta property="og:type" content="website">

    <link rel="icon" href="favicon.ico"> 
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ========================= -->
    <!-- Landing Page -->
    <!-- ========================= -->

    <main class="landing-page">

        <section class="hero">

            <p class="click-text">
                Click to Open...
            </p>

            <p class="wedding-title">
                WE'RE GETTING MARRIED
            </p>

            <!-- Spinning Music Player Widget -->
            <div id="music-player-container" class="paused">
                <audio id="bg-music" loop>
                    <source src="audio/still-the-one.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
                
                <div id="vinyl-disc" title="Click to Play/Pause Music">
                    <div class="vinyl-label">J&amp;F</div>
                </div>
            </div>

            <!-- Envelope -->
            <div class="envelope-wrapper">

                <!-- Floral Arrangement Top-Left -->
                <img src="images/floral-arrangement.png" class="floral-decoration floral-top-left" alt="Floral Arrangement">

                <!-- Floral Arrangement Bottom-Right (Flipped) -->
                <img src="images/floral-arrangement.png" class="floral-decoration floral-bottom-right" alt="Floral Arrangement">

                <div id="envelope">
                    <div class="flap"></div>
                    <div class="letter">
                        <h1>You Are Invited</h1>
                        <p>Jerico &amp; Friah</p>
                        <p id="welcome-message" class="welcome-msg"></p>
                        <a href="invitation-details.html" class="btn">View Invitation</a>
                    </div>
                    <div class="seal">J&amp;F</div>
                </div>

            </div>

        </section>



        <!-- ========================= -->
        <!-- Countdown -->
        <!-- ========================= -->

        <section class="countdown">

            <h2>forever starts soon</h2>

            <div class="timer">

                <div class="time-box">
                    <span id="days">000</span>
                    <small>Days</small>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

        </section>

    </main>



    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
