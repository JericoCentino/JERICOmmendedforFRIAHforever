<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jerico & Friah | Wedding Invitation</title>

    <link rel="icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ========================= -->
    <!-- Landing Page -->
    <!-- ========================= -->

    <main class="landing-page">

        <section class="hero">

            <p class="click-text">
                Click to Open...
            </p>

            <p class="wedding-title">
                WE'RE GETTING MARRIED
            </p>

            <!-- Envelope -->
            <div class="envelope-wrapper">

                <div id="envelope">

                    <div class="flap"></div>

                    <div class="letter">

                        <h1>You Are Invited</h1>

                        <p>Jerico &amp; Friah</p>

                        <a
                            href="invitation-details.html"
                            class="btn"
                        >
                            View Invitation
                        </a>

                    </div>

                    <div class="seal">
                        J&amp;F
                    </div>

                </div>

            </div>

        </section>



        <!-- ========================= -->
        <!-- Countdown -->
        <!-- ========================= -->

        <section class="countdown">

            <h2>forever starts soon</h2>

            <div class="timer">

                <div class="time-box">
                    <span id="days">000</span>
                    <small>Days</small>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="separator">:</div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

        </section>

    </main>



    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
